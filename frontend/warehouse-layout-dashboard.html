<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>库位平面图看板 - MES系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap");
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      body {
        font-family: "Inter", "Noto Sans SC", sans-serif;
        background:
          radial-gradient(
            circle at top right,
            rgba(96, 165, 250, 0.18),
            transparent 22%
          ),
          radial-gradient(
            circle at left bottom,
            rgba(34, 197, 94, 0.12),
            transparent 18%
          ),
          linear-gradient(180deg, #edf4fb 0%, #e8eef6 100%);
        overflow: hidden;
      }
      .industrial-shadow {
        box-shadow:
          0 2px 10px rgba(15, 23, 42, 0.08),
          0 16px 40px rgba(15, 23, 42, 0.06);
      }
      .industrial-shadow-lg {
        box-shadow:
          0 18px 44px rgba(15, 23, 42, 0.15),
          0 10px 28px rgba(37, 99, 235, 0.14);
      }
      .hero-panel {
        background:
          radial-gradient(
            circle at top right,
            rgba(147, 197, 253, 0.28),
            transparent 30%
          ),
          linear-gradient(135deg, #0f172a 0%, #1d4ed8 60%, #2563eb 100%);
      }
      .info-card {
        background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
        border: 1px solid #dbe7f3;
      }
      .warehouse-chip {
        border: 1px solid #dbe3ef;
        background: #fff;
        color: #475569;
        transition: all 0.2s ease;
      }
      .warehouse-chip.active {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #fff;
        border-color: #2563eb;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.22);
      }
      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 9999px;
      }
      .layout-board {
        position: relative;
        min-height: 720px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.92) 0%,
          rgba(246, 250, 255, 0.96) 100%
        );
        border: 1px solid #d8e5f5;
        overflow: hidden;
      }
      .layout-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.12) 1px, transparent 1px);
        background-size: 52px 52px;
        pointer-events: none;
      }
      .warehouse-boundary {
        position: absolute;
        inset: 34px 34px 34px 34px;
        border: 2px dashed #bfd4ee;
        border-radius: 30px;
        pointer-events: none;
      }
      .zone-label {
        position: absolute;
        padding: 10px 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(191, 219, 254, 0.8);
        color: #1e3a8a;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        backdrop-filter: blur(8px);
      }
      .location-node {
        position: absolute;
        border-radius: 24px;
        border: 1px solid #dbe3ef;
        color: #0f172a;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          border-color 0.18s ease,
          background 0.18s ease;
      }
      .location-node:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.14);
      }
      .location-node.active {
        border-color: #2563eb;
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.18);
        transform: translateY(-2px);
      }
      .location-node.normal {
        background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      }
      .location-node.warning {
        background: linear-gradient(180deg, #fff7ed 0%, #fffbf5 100%);
        border-color: #fdba74;
      }
      .location-node.dense {
        background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
        border-color: #93c5fd;
      }
      .location-mini {
        font-size: 11px;
        color: #64748b;
      }
      .side-panel {
        min-height: 720px;
      }
      .material-row {
        border: 1px solid #dbe7f3;
        background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
      }
      .empty-panel {
        border: 1px dashed #cbd5e1;
        background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="h-screen w-screen flex flex-col">
    <header class="bg-white industrial-shadow z-50 flex-none">
      <div class="flex items-center justify-between px-6 py-4">
        <div class="flex items-center gap-4">
          <button
            onclick="history.back()"
            class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors"
          >
            <i class="fas fa-arrow-left text-lg"></i>
          </button>
          <div class="flex items-center gap-3">
            <div
              class="w-11 h-11 bg-blue-600 rounded-xl flex items-center justify-center text-white"
            >
              <i class="fas fa-map text-xl"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold text-gray-900 tracking-tight">
                库位平面图看板
              </h1>
              <p class="text-xs text-gray-500">
                按仓库查看库位实际分布，并点击库位查看实时物料占用
              </p>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button
            type="button"
            class="flex items-center gap-2 px-4 py-2.5 rounded-2xl border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50"
          >
            <i class="fas fa-arrows-rotate"></i><span>刷新看板</span>
          </button>
        </div>
      </div>
    </header>

    <main class="px-6 pt-5 pb-6 flex-1 min-h-0">
      <div
        class="h-full grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_360px] gap-5"
      >
        <section
          class="info-card rounded-3xl industrial-shadow overflow-hidden flex flex-col"
        >
          <div
            class="px-5 py-4 border-b border-slate-200 bg-white flex flex-col gap-4"
          >
            <div
              class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"
            >
              <div>
                <h3 class="text-lg font-bold text-slate-900">仓库平面图</h3>
                <p class="text-sm text-slate-500 mt-1">
                  点击库位即可在右侧查看当前存放物料详情
                </p>
              </div>
              <div
                id="warehouseTabs"
                class="flex items-center gap-3 flex-wrap"
              ></div>
            </div>
            <div
              class="flex items-center gap-5 flex-wrap text-sm text-slate-500"
            >
              <div class="flex items-center gap-2">
                <span class="legend-dot bg-blue-300"></span>
                <span>常规占用</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="legend-dot bg-orange-300"></span>
                <span>高占用预警</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="legend-dot bg-slate-300"></span>
                <span>空库位</span>
              </div>
            </div>
          </div>
          <div class="p-5 flex-1 min-h-0">
            <div
              id="layoutBoard"
              class="layout-board rounded-[28px] industrial-shadow"
            >
              <div class="layout-grid"></div>
              <div class="warehouse-boundary"></div>
            </div>
          </div>
        </section>

        <aside
          class="info-card rounded-3xl industrial-shadow side-panel overflow-hidden flex flex-col"
        >
          <div class="px-5 py-4 border-b border-slate-200 bg-white">
            <h3 class="text-lg font-bold text-slate-900">库位详情浮层</h3>
            <p class="text-sm text-slate-500 mt-1">
              单击左侧库位后，这里会展示该库位中的物料清单与数量
            </p>
          </div>
          <div
            id="locationDetailPanel"
            class="p-5 flex-1 min-h-0 overflow-auto"
          ></div>
        </aside>
      </div>
    </main>

    <script>
      const warehouses = [
        {
          id: "finished-1",
          name: "一号成品仓",
          zones: [
            {
              label: "主通道",
              top: "48%",
              left: "45%",
              width: "10%",
              height: "20%",
            },
            {
              label: "装车口",
              top: "10%",
              left: "80%",
              width: "12%",
              height: "10%",
            },
          ],
          locations: [
            {
              id: "A-01-01",
              top: "12%",
              left: "8%",
              width: "18%",
              height: "16%",
              status: "dense",
              materials: [
                { name: "成品管 L415M", qty: "18 支" },
                { name: "成品管 L450M", qty: "12 支" },
              ],
            },
            {
              id: "A-01-03",
              top: "33%",
              left: "8%",
              width: "18%",
              height: "16%",
              status: "normal",
              materials: [{ name: "成品管 L415M", qty: "8 支" }],
            },
            {
              id: "A-01-05",
              top: "54%",
              left: "8%",
              width: "18%",
              height: "16%",
              status: "warning",
              materials: [
                { name: "成品管 X65", qty: "22 支" },
                { name: "成品管 X70", qty: "4 支" },
              ],
            },
            {
              id: "B-03-02",
              top: "12%",
              left: "58%",
              width: "18%",
              height: "16%",
              status: "normal",
              materials: [{ name: "防腐套管", qty: "20 件" }],
            },
            {
              id: "B-03-05",
              top: "33%",
              left: "58%",
              width: "18%",
              height: "16%",
              status: "dense",
              materials: [{ name: "成品管 L450M", qty: "16 支" }],
            },
            {
              id: "C-01-01",
              top: "54%",
              left: "58%",
              width: "18%",
              height: "16%",
              status: "normal",
              materials: [],
            },
          ],
        },
        {
          id: "finished-2",
          name: "二号成品仓",
          zones: [
            {
              label: "北侧通道",
              top: "12%",
              left: "40%",
              width: "20%",
              height: "8%",
            },
            {
              label: "项目备货区",
              top: "74%",
              left: "64%",
              width: "18%",
              height: "10%",
            },
          ],
          locations: [
            {
              id: "B-02-01",
              top: "20%",
              left: "10%",
              width: "20%",
              height: "18%",
              status: "dense",
              materials: [
                { name: "成品管 X65", qty: "14 支" },
                { name: "成品管 X70", qty: "10 支" },
              ],
            },
            {
              id: "B-02-03",
              top: "46%",
              left: "10%",
              width: "20%",
              height: "18%",
              status: "normal",
              materials: [{ name: "成品管 L360QS", qty: "10 支" }],
            },
            {
              id: "B-04-01",
              top: "20%",
              left: "62%",
              width: "20%",
              height: "18%",
              status: "warning",
              materials: [{ name: "成品管 L415M", qty: "24 支" }],
            },
            {
              id: "B-04-03",
              top: "46%",
              left: "62%",
              width: "20%",
              height: "18%",
              status: "normal",
              materials: [
                { name: "防腐套管", qty: "32 件" },
                { name: "密封圈", qty: "120 个" },
              ],
            },
          ],
        },
        {
          id: "temp",
          name: "待检暂存仓",
          zones: [
            {
              label: "检验通道",
              top: "14%",
              left: "34%",
              width: "32%",
              height: "8%",
            },
            {
              label: "待判区",
              top: "68%",
              left: "72%",
              width: "14%",
              height: "10%",
            },
          ],
          locations: [
            {
              id: "T-01-01",
              top: "24%",
              left: "12%",
              width: "22%",
              height: "18%",
              status: "normal",
              materials: [{ name: "防腐套管", qty: "40 件" }],
            },
            {
              id: "T-01-03",
              top: "50%",
              left: "12%",
              width: "22%",
              height: "18%",
              status: "warning",
              materials: [
                { name: "成品管 X65", qty: "6 支" },
                { name: "成品管 X70", qty: "6 支" },
              ],
            },
            {
              id: "T-02-02",
              top: "24%",
              left: "58%",
              width: "22%",
              height: "18%",
              status: "normal",
              materials: [{ name: "焊剂包", qty: "18 袋" }],
            },
            {
              id: "T-02-04",
              top: "50%",
              left: "58%",
              width: "22%",
              height: "18%",
              status: "dense",
              materials: [
                { name: "成品管 L450M", qty: "12 支" },
                { name: "防护帽", qty: "60 个" },
              ],
            },
          ],
        },
      ];

      let currentWarehouseId = warehouses[0].id;
      let activeLocationId = warehouses[0].locations[0].id;

      function getCurrentWarehouse() {
        return warehouses.find((item) => item.id === currentWarehouseId);
      }

      function getActiveLocation() {
        const warehouse = getCurrentWarehouse();
        return warehouse?.locations.find(
          (item) => item.id === activeLocationId,
        );
      }

      function renderWarehouseTabs() {
        const container = document.getElementById("warehouseTabs");
        container.innerHTML = warehouses
          .map(
            (item) => `
              <button
                type="button"
                class="warehouse-chip ${item.id === currentWarehouseId ? "active" : ""} px-4 py-2.5 rounded-2xl text-sm font-semibold"
                onclick="switchWarehouse('${item.id}')"
              >
                ${item.name}
              </button>
            `,
          )
          .join("");
      }

      function switchWarehouse(id) {
        currentWarehouseId = id;
        const warehouse = getCurrentWarehouse();
        activeLocationId = warehouse.locations[0]?.id || "";
        renderBoard();
        renderDetailPanel();
      }

      function renderBoard() {
        const warehouse = getCurrentWarehouse();
        const board = document.getElementById("layoutBoard");

        board
          .querySelectorAll(".zone-label, .location-node")
          .forEach((node) => node.remove());

        warehouse.zones.forEach((zone) => {
          const label = document.createElement("div");
          label.className = "zone-label";
          label.style.top = zone.top;
          label.style.left = zone.left;
          label.style.width = zone.width;
          label.style.height = zone.height;
          label.innerHTML = zone.label;
          board.appendChild(label);
        });

        warehouse.locations.forEach((location) => {
          const node = document.createElement("button");
          node.type = "button";
          node.className = `location-node ${location.status} ${location.id === activeLocationId ? "active" : ""} p-4 text-left`;
          node.style.top = location.top;
          node.style.left = location.left;
          node.style.width = location.width;
          node.style.height = location.height;
          const totalQty = location.materials.reduce((sum, item) => {
            const num = Number((item.qty.match(/\d+/) || ["0"])[0]);
            return sum + num;
          }, 0);
          node.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="text-lg font-bold text-slate-900">${location.id}</div>
                <div class="location-mini mt-1">${location.materials.length ? `当前 ${location.materials.length} 类物料` : "当前空库位"}</div>
              </div>
              <div class="text-right">
                <div class="text-xs text-slate-400">合计</div>
                <div class="mt-1 text-lg font-bold ${location.materials.length ? "text-blue-600" : "text-slate-400"}">${totalQty}</div>
              </div>
            </div>
          `;
          node.onclick = () => {
            activeLocationId = location.id;
            renderBoard();
            renderDetailPanel();
          };
          board.appendChild(node);
        });

        renderWarehouseTabs();
      }

      function renderDetailPanel() {
        const warehouse = getCurrentWarehouse();
        const location = getActiveLocation();
        const panel = document.getElementById("locationDetailPanel");
        if (!location) {
          panel.innerHTML = `
            <div class="empty-panel rounded-[26px] h-full flex items-center justify-center text-slate-400">
              未选择库位
            </div>
          `;
          return;
        }

        const totalQty = location.materials.reduce((sum, item) => {
          const num = Number((item.qty.match(/\d+/) || ["0"])[0]);
          return sum + num;
        }, 0);

        panel.innerHTML = `
          <div class="space-y-4">
            <div class="mini-card rounded-[26px] px-5 py-5">
              <div class="text-xs text-slate-400">当前选中库位</div>
              <div class="mt-2 text-2xl font-bold text-slate-900">${location.id}</div>
              <div class="mt-2 text-sm text-slate-500">${warehouse.name}</div>
              <div class="mt-4 grid grid-cols-2 gap-3">
                <div class="rounded-2xl bg-white/80 px-4 py-3 border border-blue-100">
                  <div class="text-xs text-slate-400">物料种类</div>
                  <div class="mt-1 text-lg font-bold text-slate-900">${location.materials.length}</div>
                </div>
                <div class="rounded-2xl bg-white/80 px-4 py-3 border border-blue-100">
                  <div class="text-xs text-slate-400">数量合计</div>
                  <div class="mt-1 text-lg font-bold text-slate-900">${totalQty}</div>
                </div>
              </div>
            </div>

            ${
              location.materials.length
                ? `
                  <div class="space-y-3">
                    ${location.materials
                      .map(
                        (item) => `
                          <div class="material-row rounded-[22px] px-4 py-4">
                            <div class="flex items-center justify-between gap-4">
                              <div>
                                <div class="text-base font-bold text-slate-900">${item.name}</div>
                                <div class="mt-1 text-xs text-slate-500">当前占用库存</div>
                              </div>
                              <div class="text-right">
                                <div class="text-xs text-slate-400">数量</div>
                                <div class="mt-1 text-xl font-bold text-blue-600">${item.qty}</div>
                              </div>
                            </div>
                          </div>
                        `,
                      )
                      .join("")}
                  </div>
                `
                : `
                  <div class="empty-panel rounded-[26px] px-5 py-10 text-center text-slate-400">
                    <div class="text-base font-semibold text-slate-500">当前库位为空</div>
                    <div class="text-sm mt-2">该库位目前没有存放物料</div>
                  </div>
                `
            }
          </div>
        `;
      }

      renderBoard();
      renderDetailPanel();
    </script>
  </body>
</html>
