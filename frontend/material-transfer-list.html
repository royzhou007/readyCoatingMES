<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>移库历史 - MES系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap");
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      body {
        font-family: "Inter", "Noto Sans SC", sans-serif;
        background: #f4f6f8;
        overflow: hidden;
      }
      .industrial-shadow {
        box-shadow:
          0 2px 8px rgba(15, 23, 42, 0.08),
          0 4px 18px rgba(15, 23, 42, 0.05);
      }
      .industrial-shadow-lg {
        box-shadow:
          0 12px 30px rgba(15, 23, 42, 0.12),
          0 10px 24px rgba(37, 99, 235, 0.12);
      }
      .hero-panel {
        background:
          radial-gradient(circle at top right, rgba(147, 197, 253, 0.28), transparent 28%),
          linear-gradient(135deg, #0f172a 0%, #1d4ed8 58%, #2563eb 100%);
      }
      .chip {
        transition: all 0.2s ease;
      }
      .chip.active {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #fff;
        border-color: #2563eb;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.2);
      }
      .search-input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid transparent;
      }
      .status-pill.done {
        background: #ecfdf3;
        color: #15803d;
        border-color: #86efac;
      }
      .status-pill.pending {
        background: #fff7ed;
        color: #c2410c;
        border-color: #fdba74;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.85;
      }
      .table-wrap {
        background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #f8fafc;
      }
      tbody tr {
        transition: background-color 0.18s ease;
      }
      tbody tr:hover {
        background: #f8fbff;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        transition: all 0.2s ease;
      }
      .icon-btn:hover {
        transform: translateY(-1px);
      }
      .modal-overlay {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .modal-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-panel {
        transform: scale(0.96) translateY(10px);
        transition: transform 0.25s ease;
      }
      .modal-overlay.open .modal-panel {
        transform: scale(1) translateY(0);
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="h-screen w-screen flex flex-col">
    <header class="bg-white industrial-shadow z-50 flex-none">
      <div class="flex items-center justify-between px-6 py-4">
        <div class="flex items-center gap-4">
          <button
            onclick="history.back()"
            class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors"
          >
            <i class="fas fa-arrow-left text-lg"></i>
          </button>
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 bg-blue-600 rounded-xl flex items-center justify-center text-white">
              <i class="fas fa-clock-rotate-left text-xl"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold text-gray-900 tracking-tight">移库历史</h1>
              <p class="text-xs text-gray-500">查看历次移库记录与仓库库位变更轨迹</p>
            </div>
          </div>
        </div>
        <button
          type="button"
          onclick="location.href='material-transfer-create.html'"
          class="flex items-center gap-2 px-4 py-2.5 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors"
        >
          <i class="fas fa-plus"></i><span>新增移库</span>
        </button>
      </div>
    </header>

    <section class="px-6 pt-5 pb-4 flex-none">
      <div class="hero-panel rounded-3xl industrial-shadow-lg text-white p-6 md:p-7">
        <div class="flex flex-col xl:flex-row xl:items-end gap-5">
          <div class="flex-1">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/12 border border-white/15 text-sm font-semibold">
              <i class="fas fa-warehouse"></i><span>仓储记录</span>
            </div>
            <h2 class="mt-4 text-3xl md:text-4xl font-bold tracking-tight">物料移库历史台账</h2>
            <p class="mt-3 text-sm md:text-base text-blue-50/90 max-w-3xl leading-relaxed">
              统一查看物料从源仓库/库位迁移到目标仓库/库位的历史记录，支持按移库单号、物料、仓库或操作人快速检索。
            </p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 min-w-full xl:min-w-[560px]">
            <div class="rounded-2xl border border-white/15 bg-white/10 backdrop-blur px-4 py-4">
              <div class="text-xs text-blue-100/85">历史记录数</div>
              <div id="metricTotal" class="mt-2 text-3xl font-bold">0</div>
            </div>
            <div class="rounded-2xl border border-white/15 bg-white/10 backdrop-blur px-4 py-4">
              <div class="text-xs text-blue-100/85">今日移库</div>
              <div id="metricToday" class="mt-2 text-3xl font-bold">0</div>
            </div>
            <div class="rounded-2xl border border-white/15 bg-white/10 backdrop-blur px-4 py-4">
              <div class="text-xs text-blue-100/85">累计移动数量</div>
              <div id="metricQty" class="mt-2 text-3xl font-bold">0</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="px-6 pb-4 flex-none">
      <div class="bg-white rounded-3xl industrial-shadow px-5 py-4">
        <div class="flex flex-col xl:flex-row xl:items-center gap-4">
          <div class="relative flex-1">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input
              id="searchInput"
              type="text"
              placeholder="搜索移库单号、物料名称、物料编码、仓库、库位或操作人"
              class="search-input w-full pl-11 pr-4 py-3 rounded-2xl border-2 border-gray-200 text-gray-700 placeholder:text-gray-400 transition-all"
            />
          </div>
          <div class="flex items-center gap-3 flex-wrap">
            <button
              type="button"
              class="chip active px-4 py-2.5 rounded-2xl border-2 border-gray-200 text-sm font-semibold text-gray-700"
              data-filter="all"
            >
              全部
            </button>
            <button
              type="button"
              class="chip px-4 py-2.5 rounded-2xl border-2 border-gray-200 text-sm font-semibold text-gray-700 bg-white"
              data-filter="done"
            >
              已完成
            </button>
            <button
              type="button"
              class="chip px-4 py-2.5 rounded-2xl border-2 border-gray-200 text-sm font-semibold text-gray-700 bg-white"
              data-filter="pending"
            >
              待确认
            </button>
          </div>
        </div>
      </div>
    </section>

    <main class="px-6 pb-6 flex-1 min-h-0">
      <div class="table-wrap h-full rounded-3xl industrial-shadow border border-slate-200 overflow-hidden flex flex-col">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 bg-white">
          <div>
            <h3 class="text-lg font-bold text-slate-900">移库记录列表</h3>
            <p class="text-sm text-slate-500 mt-1">按移库时间追踪物料的仓库库位变更过程</p>
          </div>
          <div class="text-sm text-slate-500">
            当前共
            <span id="recordCount" class="font-bold text-blue-600">0</span>
            条
          </div>
        </div>
        <div class="flex-1 min-h-0 overflow-auto">
          <table class="min-w-full text-sm text-slate-700">
            <thead class="text-slate-500">
              <tr>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200">序号</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">移库单号</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 min-w-[220px]">物料名称 / 编码</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 min-w-[240px]">源仓库 / 源库位</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 min-w-[240px]">目标仓库 / 目标库位</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">移动数量</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">操作人</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">移库时间</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">状态</th>
                <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div
      id="transferDetailModal"
      class="modal-overlay fixed inset-0 z-[90] bg-slate-950/35 flex items-center justify-center p-5"
    >
      <div
        class="modal-panel w-full max-w-7xl rounded-[28px] bg-white shadow-2xl overflow-hidden"
      >
        <div class="px-6 py-5 border-b border-slate-200 bg-white">
          <div class="flex items-start justify-between gap-4">
            <div>
              <div
                class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-sm font-semibold border border-blue-100"
              >
                <i class="fas fa-list-ul"></i><span>移库详情</span>
              </div>
              <h3 class="mt-3 text-2xl font-bold text-slate-900">
                移库钢管自编号详情
              </h3>
              <p id="transferDetailSubtitle" class="mt-1 text-sm text-slate-500">
                查看本次移库记录对应的自编号明细
              </p>
            </div>
            <button
              type="button"
              onclick="closeTransferDetailModal()"
              class="w-11 h-11 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center"
            >
              <i class="fas fa-xmark text-2xl"></i>
            </button>
          </div>
        </div>
        <div class="p-6 bg-slate-50">
          <div
            class="rounded-[28px] border border-slate-200 bg-white overflow-hidden"
          >
            <div
              class="px-6 py-5 border-b border-slate-200 flex items-center justify-between gap-4"
            >
              <div class="text-lg font-bold text-slate-900">自编号列表</div>
              <div class="text-sm text-slate-500">
                自编号数量
                <span id="transferDetailCount" class="font-bold text-blue-600">0</span>
                条
              </div>
            </div>
            <div class="max-h-[520px] overflow-auto">
              <table class="min-w-full text-sm text-slate-700">
                <thead class="text-slate-500 bg-slate-50">
                  <tr>
                    <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">序号</th>
                    <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">物料名称</th>
                    <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">物料编码</th>
                    <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">规格型号</th>
                    <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">自编号</th>
                    <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">捆号</th>
                    <th class="px-4 py-4 text-left font-bold border-b border-slate-200 whitespace-nowrap">管号</th>
                  </tr>
                </thead>
                <tbody id="transferDetailTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const transferHistory = [
        {
          serial: 1,
          transferNo: "YKD-20260413-001",
          materialName: "成品管 L415M",
          materialCode: "MAT-BP-001",
          sourceWarehouse: "一号成品仓",
          sourceLocation: "A-01-03",
          targetWarehouse: "二号成品仓",
          targetLocation: "B-03-02",
          qty: "3 支",
          operator: "张海峰",
          time: "2026-04-13 09:26",
          status: "done",
          statusText: "已完成",
          pipes: [
            { name: "成品管 L415M", code: "MAT-BP-001", spec: "D813 × 17.5 × 12000", selfCode: "ZBH-0001", bundleNo: "BH-001", pipeNo: "GH-0001" },
            { name: "成品管 L415M", code: "MAT-BP-001", spec: "D813 × 17.5 × 12000", selfCode: "ZBH-0002", bundleNo: "BH-001", pipeNo: "GH-0002" },
            { name: "成品管 L415M", code: "MAT-BP-001", spec: "D813 × 17.5 × 12000", selfCode: "ZBH-0003", bundleNo: "BH-001", pipeNo: "GH-0003" },
          ],
        },
        {
          serial: 2,
          transferNo: "YKD-20260413-002",
          materialName: "防腐套管",
          materialCode: "MAT-FG-011",
          sourceWarehouse: "待检暂存仓",
          sourceLocation: "T-01-01",
          targetWarehouse: "项目备货仓",
          targetLocation: "C-01-01",
          qty: "20 件",
          operator: "王志远",
          time: "2026-04-13 10:12",
          status: "done",
          statusText: "已完成",
          pipes: [],
        },
        {
          serial: 3,
          transferNo: "YKD-20260412-014",
          materialName: "成品管 X65",
          materialCode: "MAT-BP-018",
          sourceWarehouse: "二号成品仓",
          sourceLocation: "B-02-01",
          targetWarehouse: "项目备货仓",
          targetLocation: "C-01-03",
          qty: "2 支",
          operator: "李建军",
          time: "2026-04-12 16:40",
          status: "pending",
          statusText: "待确认",
          pipes: [
            { name: "成品管 X65", code: "MAT-BP-018", spec: "D711 × 14.2 × 11800", selfCode: "ZBH-0201", bundleNo: "BH-008", pipeNo: "GH-0201" },
            { name: "成品管 X65", code: "MAT-BP-018", spec: "D711 × 14.2 × 11800", selfCode: "ZBH-0202", bundleNo: "BH-008", pipeNo: "GH-0202" },
          ],
        },
        {
          serial: 4,
          transferNo: "YKD-20260411-009",
          materialName: "成品管 L450M",
          materialCode: "MAT-BP-002",
          sourceWarehouse: "一号成品仓",
          sourceLocation: "A-01-05",
          targetWarehouse: "二号成品仓",
          targetLocation: "B-03-05",
          qty: "8 支",
          operator: "周明涛",
          time: "2026-04-11 14:18",
          status: "done",
          statusText: "已完成",
          pipes: [
            { name: "成品管 L450M", code: "MAT-BP-002", spec: "D813 × 19.1 × 12000", selfCode: "ZBH-0101", bundleNo: "BH-003", pipeNo: "GH-0101" },
            { name: "成品管 L450M", code: "MAT-BP-002", spec: "D813 × 19.1 × 12000", selfCode: "ZBH-0102", bundleNo: "BH-003", pipeNo: "GH-0102" },
            { name: "成品管 L450M", code: "MAT-BP-002", spec: "D813 × 19.1 × 12000", selfCode: "ZBH-0103", bundleNo: "BH-003", pipeNo: "GH-0103" },
          ],
        },
      ];

      let currentFilter = "all";

      function getStatusClass(status) {
        return status === "done" ? "done" : "pending";
      }

      function renderMetrics() {
        document.getElementById("metricTotal").textContent = transferHistory.length;
        document.getElementById("metricToday").textContent = transferHistory.filter(
          (item) => item.time.startsWith("2026-04-13"),
        ).length;
        document.getElementById("metricQty").textContent = transferHistory.length;
      }

      function renderTable() {
        const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
        const filtered = transferHistory.filter((item) => {
          const matchFilter = currentFilter === "all" || item.status === currentFilter;
          const text = `${item.transferNo} ${item.materialName} ${item.materialCode} ${item.sourceWarehouse} ${item.sourceLocation} ${item.targetWarehouse} ${item.targetLocation} ${item.operator}`.toLowerCase();
          return matchFilter && (!keyword || text.includes(keyword));
        });

        document.getElementById("recordCount").textContent = filtered.length;
        document.getElementById("historyTableBody").innerHTML = filtered
          .map(
            (item) => `
              <tr>
                <td class="px-4 py-4 border-b border-slate-100 font-semibold text-slate-900">${item.serial}</td>
                <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap font-semibold text-blue-700">${item.transferNo}</td>
                <td class="px-4 py-4 border-b border-slate-100">
                  <div class="font-semibold text-slate-900">${item.materialName}</div>
                  <div class="mt-1 text-xs text-slate-500">${item.materialCode}</div>
                </td>
                <td class="px-4 py-4 border-b border-slate-100">
                  <div class="font-semibold text-slate-900">${item.sourceWarehouse}</div>
                  <div class="mt-1 text-xs text-slate-500">${item.sourceLocation}</div>
                </td>
                <td class="px-4 py-4 border-b border-slate-100">
                  <div class="font-semibold text-slate-900">${item.targetWarehouse}</div>
                  <div class="mt-1 text-xs text-slate-500">${item.targetLocation}</div>
                </td>
                <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap font-semibold text-slate-900">${item.qty}</td>
                <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">${item.operator}</td>
                <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">${item.time}</td>
                <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">
                  <span class="status-pill ${getStatusClass(item.status)}">
                    <span class="status-dot"></span>${item.statusText}
                  </span>
                </td>
                <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">
                  <div class="flex items-center gap-2">
                    <button type="button" title="查看" class="icon-btn bg-blue-50 text-blue-700 hover:bg-blue-100" onclick="openTransferDetail('${item.transferNo}')">
                      <i class="fas fa-eye"></i>
                    </button>
                    <button type="button" title="再次移库" class="icon-btn bg-amber-50 text-amber-700 hover:bg-amber-100" onclick="location.href='material-transfer-create.html'">
                      <i class="fas fa-right-left"></i>
                    </button>
                  </div>
                </td>
              </tr>`,
          )
          .join("");
      }

      function openTransferDetail(transferNo) {
        const record = transferHistory.find((item) => item.transferNo === transferNo);
        if (!record) return;
        const pipes = record.pipes || [];
        document.getElementById("transferDetailSubtitle").textContent =
          `${record.transferNo} | ${record.materialName} | ${record.sourceWarehouse} / ${record.sourceLocation} -> ${record.targetWarehouse} / ${record.targetLocation}`;
        document.getElementById("transferDetailCount").textContent = pipes.length;
        const body = document.getElementById("transferDetailTableBody");
        if (!pipes.length) {
          body.innerHTML =
            '<tr><td colspan="7" class="px-4 py-12 text-center text-slate-400">当前记录没有自编号明细，通常为按数量移库的普通物料。</td></tr>';
        } else {
          body.innerHTML = pipes
            .map(
              (pipe, index) => `
                <tr>
                  <td class="px-4 py-4 border-b border-slate-100 font-semibold text-slate-900">${index + 1}</td>
                  <td class="px-4 py-4 border-b border-slate-100">${pipe.name}</td>
                  <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">${pipe.code}</td>
                  <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">${pipe.spec}</td>
                  <td class="px-4 py-4 border-b border-slate-100 font-semibold text-slate-900 whitespace-nowrap">${pipe.selfCode}</td>
                  <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">${pipe.bundleNo}</td>
                  <td class="px-4 py-4 border-b border-slate-100 whitespace-nowrap">${pipe.pipeNo}</td>
                </tr>`,
            )
            .join("");
        }
        document.getElementById("transferDetailModal").classList.add("open");
      }

      function closeTransferDetailModal() {
        document.getElementById("transferDetailModal").classList.remove("open");
      }

      document.getElementById("searchInput").addEventListener("input", renderTable);
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((node) => {
            node.classList.toggle("active", node.dataset.filter === currentFilter);
          });
          renderTable();
        });
      });
      document
        .getElementById("transferDetailModal")
        .addEventListener("click", (event) => {
          if (event.target.id === "transferDetailModal") closeTransferDetailModal();
        });

      renderMetrics();
      renderTable();
    </script>
  </body>
</html>
